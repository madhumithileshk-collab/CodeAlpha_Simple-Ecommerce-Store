
<!DOCTYPE html>
<html>
<head>
    <title>Register - ShopEasy</title>
</head>
<body style="font-family:Arial;text-align:center;background:#f4f4f9;padding:40px;">
    <h1>Create Account</h1>

        {% csrf_token %}

</html>
